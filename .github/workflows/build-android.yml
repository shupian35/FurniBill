name: Android Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/build-ios.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        type: choice
        options:
          - debug
          - release
          - both

env:
  APP_NAME: furni_bill

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Setup Keystore (Release)
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            echo "storeFile=upload-keystore.jks" > android/key.properties
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" >> android/key.properties
            echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
            echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
            echo "RELEASE_SIGNING=true" >> $GITHUB_ENV
          else
            echo "RELEASE_SIGNING=false" >> $GITHUB_ENV
          fi

      - name: Build APK (Debug)
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == ''
        run: flutter build apk --debug

      - name: Build APK (Release)
        if: (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push' || github.event_name == 'pull_request') && env.RELEASE_SIGNING == 'false'
        run: flutter build apk --release

      - name: Build APK (Release Signed)
        if: (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push' || github.event_name == 'pull_request') && env.RELEASE_SIGNING == 'true'
        run: flutter build apk --release

      - name: Build AAB (Release)
        if: (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push') && env.RELEASE_SIGNING == 'false'
        run: flutter build appbundle --release

      - name: Build AAB (Release Signed)
        if: (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push') && env.RELEASE_SIGNING == 'true'
        run: flutter build appbundle --release

      - name: Upload Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == ''
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload Release APK
        if: (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push' || github.event_name == 'pull_request') && hashFiles('build/app/outputs/flutter-apk/app-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB
        if: (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push') && hashFiles('build/app/outputs/bundle/release/app-release.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
