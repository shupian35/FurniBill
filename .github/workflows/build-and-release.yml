name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: furni_bill

jobs:
  # ============================================================
  # Test
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  # ============================================================
  # Android Debug APK
  # ============================================================
  build-android:
    name: Android APK
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/furni_bill.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: furni_bill-apk
          path: build/app/outputs/flutter-apk/furni_bill.apk
          retention-days: 30

  # ============================================================
  # iOS Release (unsigned IPA, optimized for sideloading / LiveContainer)
  # ============================================================
  build-ios:
    name: iOS IPA (unsigned)
    needs: [test]
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock', 'ios/Runner.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter clean
        run: flutter clean

      # Build the iOS app in release mode. `--no-codesign` skips signing in
      # Flutter's xcode_backend.sh step; we also override Xcode build settings
      # to be explicit about it (the project still has CODE_SIGN_STYLE=Automatic).
      - name: Build iOS (release, unsigned)
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --export-options-plist=ios/ExportOptions.plist

      - name: Verify .app exists
        run: |
          APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "::error::$APP not produced by flutter build"
            exit 1
          fi
          echo "App bundle: $APP"
          ls -la "$APP" | head -20
          echo "Bundle ID:"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          echo "Executable:"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist"
          file "$APP/Runner"

      - name: Package as IPA
        run: |
          # Use ditto (not cp -r) so that macOS resource forks and HFS
          # metadata are preserved -- this is what `xcodebuild -exportArchive`
          # does internally, and it produces an IPA that sideloaders
          # (LiveContainer, AltStore, sideloadly) accept reliably.
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          ditto -c -k --sequesterRsrc --keepParent Payload ../furni_bill.ipa
          cd ../../..

      - name: Validate IPA structure
        run: |
          IPA="build/furni_bill.ipa"
          if [ ! -f "$IPA" ]; then
            echo "::error::IPA not produced"
            exit 1
          fi
          echo "IPA size: $(du -h "$IPA" | cut -f1)"
          echo "--- Payload/ contents ---"
          unzip -l "$IPA" | grep -E "(Payload/|Info.plist|Runner$)" | head -20
          # Quick smoke test: extract to /tmp and verify the .app is runnable
          rm -rf /tmp/ipa-verify && mkdir -p /tmp/ipa-verify
          unzip -q "$IPA" -d /tmp/ipa-verify
          if [ ! -d "/tmp/ipa-verify/Payload/Runner.app" ]; then
            echo "::error::Payload/Runner.app missing from IPA"
            exit 1
          fi
          echo "IPA structure OK"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: furni_bill-ipa
          path: build/furni_bill.ipa
          retention-days: 30

  # ============================================================
  # Create GitHub Release (Pre-release)
  # ============================================================
  release:
    name: Publish Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "App version: ${VERSION}"

      - name: Generate release tag
        id: tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date +'%Y%m%d')
          TAG="v${VERSION}-beta.${DATE}.${GITHUB_RUN_NUMBER}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, will append run number"
            NEW_TAG="${TAG}.retry${GITHUB_RUN_NUMBER}"
            echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
            echo "New tag: ${NEW_TAG}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: furni_bill-apk

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: furni_bill-ipa

      - name: Generate changelog from commits
        id: changelog
        run: |
          echo "## 鏇存柊鍐呭" > CHANGELOG_BODY.md
          echo "" >> CHANGELOG_BODY.md
          git log --oneline -10 --pretty=format:"- %s" >> CHANGELOG_BODY.md
          echo "" >> CHANGELOG_BODY.md
          echo "" >> CHANGELOG_BODY.md
          echo "---" >> CHANGELOG_BODY.md
          echo "" >> CHANGELOG_BODY.md
          echo "### 鏋勫缓淇℃伅" >> CHANGELOG_BODY.md
          echo "- **鐗堟湰**: ${{ steps.version.outputs.version }}" >> CHANGELOG_BODY.md
          echo "- **鎻愪氦**: \`${{ github.sha }}\`" >> CHANGELOG_BODY.md
          echo "- **鍒嗘敮**: ${{ github.ref_name }}" >> CHANGELOG_BODY.md
          echo "- **杩愯缂栧彿**: #${{ github.run_number }}" >> CHANGELOG_BODY.md
          echo "- **鏋勫缓鏃堕棿**: $(date +'%Y-%m-%d %H:%M:%S UTC')" >> CHANGELOG_BODY.md
          echo "" >> CHANGELOG_BODY.md
          echo "### 浜х墿璇存槑" >> CHANGELOG_BODY.md
          echo "| 鏂囦欢 | 璇存槑 |" >> CHANGELOG_BODY.md
          echo "|---|---|" >> CHANGELOG_BODY.md
          echo "| \`furni_bill.apk\` | Android 璋冭瘯瀹夎鍖?|" >> CHANGELOG_BODY.md
          echo "| \`furni_bill.ipa\` | iOS **鏃犵鍚?* release 鍖咃紙鏀寔 LiveContainer / AltStore / sideloadly 渚ц浇锛?|" >> CHANGELOG_BODY.md
          echo "" >> CHANGELOG_BODY.md
          echo "> 鈿狅笍 姝ょ増鏈负 **Pre-release** 鐗堟湰锛屼粎渚涙祴璇曚娇鐢紝涓嶅缓璁湪鐢熶骇鐜浣跨敤銆? >> CHANGELOG_BODY.md

      - name: Delete existing release with same tag (if any)
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const tag = '${{ steps.check_tag.outputs.tag }}';
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id
              });
              console.log(`Deleted existing release for tag ${tag}`);
            } catch (e) {
              console.log(`No existing release found for tag ${tag}`);
            }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_tag.outputs.tag }}
          name: "${{ steps.check_tag.outputs.tag }} (Pre-release)"
          body_path: CHANGELOG_BODY.md
          files: |
            furni_bill.apk
            furni_bill.ipa
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
